[project]
name = "harness"
version = "0.1.0"
description = "Component-substitutable LLM agent harness for a controlled study of memory representation under context constraint"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",          # exact cosine search — no ANN index, approximation is a confound
    "networkx>=3.3",       # graph memory; a run's graph is hundreds of nodes
    "pydantic>=2.7",       # config validation only, not on the hot path
    "pyyaml>=6.0",
    "httpx>=0.27",         # LLM client; no framework dependency
    "sentence-transformers>=3.0",
    "tenacity>=8.3",       # bounded retry on transient API errors
]

[project.optional-dependencies]
stats = [
    "scipy>=1.13",
    "statsmodels>=0.14",   # mixed-effects logistic regression
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

# Third-party components register here without forking the harness.
# A separate package declares its own, e.g.
#   [project.entry-points."harness.memory"]
#   my_memory = "my_package.memory:MyMemory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 formats python blocks inside markdown. SPEC.md and CONTRIBUTING.md quote the
# frozen contract deliberately; reformatting them would make the spec drift from the code
# it specifies for no reason.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not expensive' --strict-markers"
markers = [
    "expensive: costs tokens or money; excluded from CI",
]
pythonpath = ["src", "."]
